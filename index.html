:root{
  --bg:#FFFFFF; --surface:#F7F6F2; --surface2:#EFEDE6; --border:#E1DED4;
  --text:#211F1B; --text2:#6E6C63; --muted:#A4A296;
  --amber:#C2660C; --amber-soft:#F5E3CC; --red:#C0352E; --red-soft:#F6DEDB;

*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
body{font-family:'Noto Sans KR',sans-serif;}
.mono{font-family:'Space Grotesk',monospace;}
.rh{min-height:100vh;padding-bottom:24px;}
.rh-header{padding:22px 18px 14px;border-bottom:1px solid var(--border);position:relative;display:flex;align-items:center;gap:10px;}
.rh-back{background:none;border:1px solid var(--border);border-radius:8px;width:34px;height:34px;color:var(--text);
  cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0;}
.rh-back.show{display:flex;}
.rh-header-titles h1{font-family:'Space Grotesk',monospace;font-weight:700;font-size:18px;margin:0 0 3px;letter-spacing:.2px;}
.rh-header-titles .sub{font-size:12px;color:var(--text2);}
.rh-body{padding:20px 16px 8px;max-width:640px;margin:0 auto;}
.rh-home{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:36px 8px 10px;max-width:420px;margin:0 auto;}
.rh-notif-btn{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 16px;
  font-size:13px;color:var(--text2);cursor:pointer;margin-bottom:4px;}
.rh-notif-btn:disabled{color:var(--green);border-color:var(--green);cursor:default;background:var(--green-soft);}
.rh-home-btn{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px 20px;
  display:flex;align-items:center;gap:16px;cursor:pointer;text-align:left;}
.rh-home-btn:active{background:var(--surface2);}
.rh-home-btn .ic{width:46px;height:46px;border-radius:10px;background:var(--amber-soft);color:var(--amber);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.rh-home-btn.report .ic{background:var(--red-soft);color:var(--red);}
.rh-home-btn.situation .ic{background:var(--green-soft);color:var(--green);}
.rh-home-btn .tt{font-weight:700;font-size:15px;margin-bottom:2px;}
.rh-home-btn .dd{font-size:12px;color:var(--text2);}
.rh-home-btn .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:12px;padding:2px 9px;font-size:11px;font-family:'Space Grotesk',monospace;}
.rh-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;}
.rh-label{font-size:12px;color:var(--text2);margin-bottom:6px;display:block;}
.rh-select,.rh-input,.rh-textarea{width:100%;background:#fff;border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:10px 12px;font-size:14px;font-family:'Noto Sans KR',sans-serif;}
.rh-textarea{min-height:60px;resize:vertical;}
.rh-select:focus,.rh-input:focus,.rh-textarea:focus{outline:none;border-color:var(--amber);}
.rh-btn{background:var(--amber);color:#fff;border:none;border-radius:8px;padding:12px 16px;font-weight:700;
  font-size:14px;cursor:pointer;width:100%;font-family:'Space Grotesk',monospace;}
.rh-btn:disabled{opacity:.4;}
.rh-btn.ghost{background:none;border:1px solid var(--border);color:var(--text2);font-weight:500;}
.rh-theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.rh-theme-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 10px;
  color:var(--text);cursor:pointer;font-size:14px;font-weight:500;text-align:center;}
.rh-theme-btn.active{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);}
.rh-section-title{font-family:'Space Grotesk',monospace;font-size:12px;color:var(--amber);letter-spacing:.5px;
  margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.rh-item{border-top:1px solid var(--border);padding:12px 0;}
.rh-item:first-child{border-top:none;}
.rh-item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.rh-item-name{font-weight:700;font-size:14px;}
.rh-item-detail{font-size:12px;color:var(--text2);margin-top:2px;line-height:1.5;}
.rh-item-criteria{font-size:12px;color:var(--muted);margin-top:2px;}
.rh-ox{display:flex;gap:6px;}
.rh-ox button{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:#fff;
  color:var(--text2);font-weight:700;cursor:pointer;font-family:'Space Grotesk',monospace;}
.rh-ox button.o.sel{background:var(--green-soft);border-color:var(--green);color:var(--green);}
.rh-ox button.x.sel{background:var(--red-soft);border-color:var(--red);color:var(--red);}

.rh-item-extra.show{display:block;}
.rh-photo-row{display:flex;align-items:center;gap:10px;margin-top:8px;}
.rh-photo-btn{border:1px dashed var(--border);color:var(--text2);background:#fff;border-radius:8px;
  padding:8px 12px;font-size:12px;cursor:pointer;}
.rh-photo-thumb{width:52px;height:52px;border-radius:6px;object-fit:cover;border:1px solid var(--border);}
.rh-viewable-img{cursor:zoom-in;}
.rh-ic{width:1.1em;height:1.1em;vertical-align:-0.15em;display:inline-block;}
.rh-issue{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--red);border-radius:8px;
  padding:12px 14px;margin-bottom:10px;}
.rh-issue.resolved{border-left-color:var(--green);opacity:.9;}
.rh-issue.held{border-left-color:var(--amber);}
.rh-hold-reason{font-size:12px;color:var(--amber);background:var(--amber-soft);padding:8px 10px;border-radius:6px;margin-bottom:8px;}
.rh-resolve-expand{display:none;}
.rh-resolve-expand.show{display:block;}
.rh-resolve-photo{width:100%;max-width:320px;border-radius:8px;display:block;margin-bottom:6px;cursor:zoom-in;}
.rh-problem-photo-small{width:64px;height:64px;object-fit:cover;border-radius:6px;display:block;cursor:zoom-in;}
.hold-btn{background:var(--amber);color:#fff;border:none;}
.rh-issue-top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px;font-family:'Space Grotesk',monospace;}
.rh-issue-content{font-size:13px;color:var(--text2);margin-bottom:8px;}
.rh-empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 10px;}
.rh-toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--text);
  color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;
  z-index:50;opacity:0;transition:opacity .3s;pointer-events:none;}
.rh-toast.show{opacity:1;}
.rh-badge{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:12px;
  padding:2px 9px;font-size:11px;color:var(--text2);margin-left:6px;}
.rh-hist-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
.rh-hist-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.rh-hist-theme{font-weight:700;font-size:14px;color:var(--amber);}
.rh-hist-meta{font-size:11px;color:var(--muted);font-family:'Space Grotesk',monospace;}
.rh-hist-item{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--border);font-size:13px;}
.rh-hist-item:first-child{border-top:none;}
.rh-hist-ox{font-family:'Space Grotesk',monospace;font-weight:700;flex-shrink:0;}
.rh-hist-ox.x{color:var(--red);}
.rh-hist-ox.o{color:var(--green);}
.rh-hist-note{font-size:11px;color:var(--text2);margin-top:2px;}
.rh-setup{max-width:480px;margin:60px auto;padding:24px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:14px;line-height:1.7;}
.rh-setup code{background:var(--surface2);padding:2px 6px;border-radius:4px;font-size:12px;}

function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'),1800); }

// ---------- Firestore data layer (compat SDK) ----------
async function fbGetThemes(){
  try{
    const snap = await db.collection('config').doc('themes').get();
    if(snap.exists) return JSON.parse(snap.data().json);
    await db.collection('config').doc('themes').set({json: JSON.stringify(DEFAULT_THEMES)});
    return DEFAULT_THEMES;
  }catch(e){ console.error(e); toast('테마 정보를 불러오지 못했습니다'); return DEFAULT_THEMES; }
}
async function fbSaveThemes(themes){
  try{ await db.collection('config').doc('themes').set({json: JSON.stringify(themes)}); }
  catch(e){ console.error(e); toast('저장 실패'); }
}
async function fbAddInspection(rec){
  try{ await db.collection('inspections').add(rec); }
  catch(e){ console.error(e); toast('점검 저장 실패, 네트워크를 확인해주세요'); throw e; }

  }catch(e){ console.error(e); toast('점검 이력을 불러오지 못했습니다'); return []; }

// 공용: 특이사항/현장상황 상태 변경 (unresolved / held / resolved)
async function fbUpdateIssueStatus(collectionName, id, status, extra){
  try{
    const update = Object.assign({status:status}, extra||{});
    if(status==='resolved') update.resolvedAt = Date.now();
    if(status==='held') update.heldAt = Date.now();
    await db.collection(collectionName).doc(id).update(update);
  }
  catch(e){ console.error('fbUpdateIssueStatus error:', e); toast('상태 변경 실패: '+e.message); throw e; }
}

function compressImage(file, maxW, quality){
  quality = quality || 0.45;
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function setHeader(tab){
  if(tab==='home'){
    backBtn.classList.remove('show');
    titleEl.textContent = 'RUSHHOUR CINEMATIC — 3호점';
    subEl.textContent = '주간점검 · 특이사항 보고 시스템';
  }else{
    backBtn.classList.add('show');
    const map = {inspect:'주간점검', history:'주간점검 결과 확인', report:'특이사항 보고', situation:'현장상황공유'};
    titleEl.textContent = map[tab];
    subEl.textContent = '3호점';
  }
}

function render(){
  setHeader(state.tab);
  if(state.tab==='home') renderHome();
  else if(state.tab==='inspect') renderInspect();
  else if(state.tab==='history') renderHistory();
  else if(state.tab==='situation') renderSituation();
  else renderReport();
}

function renderInspect(){
  if(!state.theme){
    let html = '<div class="rh-label">점검할 테마를 선택하세요</div><div class="rh-theme-grid">';
    Object.keys(state.themes).forEach(t=>{
      html += `<button class="rh-theme-btn" data-t="${t}">${t}</button>`;
    });
    html += `</div><button class="rh-btn ghost" id="addThemeBtn"><svg class="rh-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> 새 테마 추가</button>`;
    body.innerHTML = html;
    body.querySelectorAll('.rh-theme-btn').forEach(b=>{
      b.onclick = ()=>{ state.theme=b.dataset.t; state.sectionsData=JSON.parse(JSON.stringify(state.themes[b.dataset.t])); state.results={}; render(); };
    });
    document.getElementById('addThemeBtn').onclick = addNewTheme;
    return;
  }
  let html = `
    <div class="rh-card">
      <div class="rh-label">점검일자 / 점검자</div>
      <div style="display:flex;gap:8px;margin-bottom:2px;">
        <input class="rh-input mono" id="inspDate" type="date" value="${todayStr()}" style="flex:1;">
        <input class="rh-input" id="inspName" placeholder="이름 입력" style="flex:1;">
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <div class="mono" style="font-size:15px;font-weight:700;color:var(--amber);">${state.theme}</div>
      <button class="rh-btn ghost" id="changeThemeBtn" style="width:auto;padding:6px 12px;font-size:12px;">테마 변경</button>
    </div>`;
  state.sectionsData.forEach((sec, si)=>{
    html += `<div class="rh-section-title">${sec.title}</div><div class="rh-card" style="padding:4px 16px;">`;
    sec.items.forEach((item, ii)=>{
      const key = si+'-'+ii;
      const res = state.results[key] || {};
      html += `
        <div class="rh-item">
          <div class="rh-item-head">
            <div>
              <div class="rh-item-name">${item.name}</div>
              <div class="rh-item-detail">${item.detail}</div>
              <div class="rh-item-criteria">기준: ${item.criteria}</div>
            </div>
            <div class="rh-ox">
              <button class="o ${res.ox==='O'?'sel':''}" data-key="${key}" data-v="O">O</button>
              <button class="x ${res.ox==='X'?'sel':''}" data-key="${key}" data-v="X">X</button>
            </div>
          </div>
          <div class="rh-item-extra ${res.ox==='X'?'show':''}" id="extra-${key}">
            <textarea class="rh-textarea" placeholder="조치사항을 입력하세요" data-key="${key}">${res.note||''}</textarea>
            <div class="rh-photo-row">
              <button class="rh-photo-btn" data-key="${key}"><svg class="rh-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1l1.5-2h7L17 6h1a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/><circle cx="12" cy="13" r="3.5"/></svg> 사진 첨부(선택)</button>
              <input type="file" accept="image/*" capture="environment" style="display:none;" id="file-${key}">
              <img class="rh-photo-thumb rh-viewable-img" id="thumb-${key}" style="display:${res.photo?'block':'none'};" src="${res.photo||''}">
            </div>
          </div>
        </div>`;
    });
    html += `</div>`;
  });
  html += `<button class="rh-btn" id="submitInspBtn" style="margin-top:6px;">점검 완료 제출</button>`;
  body.innerHTML = html;

  document.getElementById('changeThemeBtn').onclick = ()=>{ state.theme=null; render(); };
  body.querySelectorAll('.rh-ox button').forEach(b=>{
    b.onclick = ()=>{
      const key=b.dataset.key, v=b.dataset.v;
      state.results[key] = state.results[key]||{};
      state.results[key].ox = v;
      render();
    };
  });
  body.querySelectorAll('.rh-item-extra textarea').forEach(t=>{
    t.oninput = ()=>{ const key=t.dataset.key; state.results[key]=state.results[key]||{}; state.results[key].note=t.value; };
  });
  body.querySelectorAll('.rh-photo-btn').forEach(b=>{
    b.onclick = ()=> document.getElementById('file-'+b.dataset.key).click();
  });
  body.querySelectorAll('input[type=file]').forEach(inp=>{
    inp.onchange = async ()=>{
      const key = inp.id.replace('file-','');
      if(!inp.files[0]) return;
      const btn = body.querySelector(`.rh-photo-btn[data-key="${key}"]`);
      const origText = btn.innerHTML;
      btn.innerHTML = '처리 중...'; btn.disabled = true;
      try{
        const dataUrl = await compressImage(inp.files[0], 640);
        state.results[key] = state.results[key]||{};
        state.results[key].photo = dataUrl;
        const thumbEl = document.getElementById('thumb-'+key);
        thumbEl.src = dataUrl;
        thumbEl.style.display='block';
      }catch(e){ toast('사진 처리 실패'); }
      btn.innerHTML = origText; btn.disabled = false;
    };
  });
  document.getElementById('submitInspBtn').onclick = submitInspection;
}

async function addNewTheme(){
  const name = prompt('새 테마 이름을 입력하세요');
  if(!name) return;
  if(state.themes[name]){ toast('이미 존재하는 테마입니다'); return; }
  state.themes[name] = [{title:'A. 테마 점검', items:[{name:'점검항목1', detail:'점검 내용을 입력하세요', criteria:'정상 기준을 입력하세요'}]}];
  await fbSaveThemes(state.themes);
  toast(name+' 테마가 추가되었습니다');
  render();
}

async function submitInspection(){
  const name = document.getElementById('inspName').value.trim();
  const date = document.getElementById('inspDate').value;
  if(!name){ toast('점검자 이름을 입력해주세요'); return; }
  const submitBtn = document.getElementById('submitInspBtn');
  const flatItems = [];
  state.sectionsData.forEach((sec,si)=> sec.items.forEach((item,ii)=>{
    const key=si+'-'+ii, r = state.results[key]||{};
    flatItems.push({section:sec.title, name:item.name, ox:r.ox||'', note:r.note||'', photo:r.photo||null});
  }));
  const unchecked = flatItems.filter(i=>!i.ox).length;
  if(unchecked>0 && !confirm(unchecked+'개 항목이 미체크 상태입니다. 그래도 제출할까요?')) return;

  submitBtn.disabled = true; submitBtn.textContent = '저장 중...';
  try{
    const rec = { theme:state.theme, date, inspector:name, items:flatItems, createdAt:Date.now() };
    await fbAddInspection(rec);
    toast('점검이 저장되었습니다');
    goHome();
  }catch(e){
    submitBtn.disabled = false; submitBtn.textContent = '점검 완료 제출';
  }
}

// ---------- 주간점검 결과 확인 ----------
function renderHistory(){
  const themeOpts = ['전체', ...Object.keys(state.themes)].map(t=>
    `<option value="${t}" ${state.historyFilter===t?'selected':''}>${t}</option>`).join('');
  let html = `<select class="rh-select" id="histFilter" style="margin-bottom:16px;">${themeOpts}</select>`;
  const filtered = state.inspections.filter(r=> state.historyFilter==='전체' || r.theme===state.historyFilter);
  if(!filtered.length){ html += `<div class="rh-empty">저장된 점검 기록이 없습니다</div>`; }
  filtered.forEach(rec=>{
    html += `<div class="rh-hist-card">
      <div class="rh-hist-top">
        <span class="rh-hist-theme">${rec.theme}</span>
        <span class="rh-hist-meta">${rec.date} · ${rec.inspector}</span>
      </div>`;
    (rec.items||[]).forEach(it=>{
      if(!it.ox) return;
      html += `<div class="rh-hist-item">
        <div>
          <div>${it.name}</div>
          ${it.ox==='X'? `<div class="rh-hist-note">조치: ${it.note||'(미입력)'}</div>`:''}
          ${it.photo? `<img class="rh-viewable-img" src="${it.photo}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;margin-top:6px;display:block;cursor:zoom-in;">`:''}
        </div>
        <div class="rh-hist-ox ${it.ox==='X'?'x':'o'}">${it.ox}</div>
      </div>`;
    });
    html += `</div>`;
  });
  body.innerHTML = html;
  document.getElementById('histFilter').onchange = (e)=>{ state.historyFilter = e.target.value; renderHistory(); };
}

// ---------- 특이사항 보고 (미해결 이상항목 통합) ----------
function renderReport(){

  const unresolved = state.reports.filter(r=>(r.status||'unresolved')==='unresolved').sort((a,b)=>b.createdAt-a.createdAt);
  const held = state.reports.filter(r=>r.status==='held').sort((a,b)=>b.createdAt-a.createdAt);
  const resolved = state.reports.filter(r=>r.status==='resolved').sort((a,b)=>b.createdAt-a.createdAt);

  let html = `
    <div class="rh-card">
      <div class="rh-label">작성자 이름</div>
      <input class="rh-input" id="repName" placeholder="이름 입력" style="margin-bottom:12px;">
      <div class="rh-label">관련 테마 (해당없으면 '기타')</div>
      <select class="rh-select" id="repTheme" style="margin-bottom:12px;">
        <option value="기타">기타</option>${themeOpts}
      </select>
      <div class="rh-label">특이사항 내용</div>
      <textarea class="rh-textarea" id="repContent" placeholder="발견하신 특이사항을 자유롭게 적어주세요" style="margin-bottom:12px;min-height:90px;"></textarea>
      <div class="rh-label">사진 (선택)</div>
      <div class="rh-photo-row" style="margin-bottom:14px;">
        <button class="rh-photo-btn" id="repPhotoBtn"><svg class="rh-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1l1.5-2h7L17 6h1a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/><circle cx="12" cy="13" r="3.5"/></svg> 사진 촬영/첨부</button>
        <input type="file" accept="image/*" capture="environment" style="display:none;" id="repFile">
        <img class="rh-photo-thumb rh-viewable-img" id="repThumb" style="display:none;">
      </div>
      <button class="rh-btn" id="repSubmitBtn">보고 제출</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin:20px 0 10px;">
      <span class="mono" style="font-size:14px;font-weight:700;">미해결 항목</span>
      <span class="rh-badge" style="color:var(--red);border-color:var(--red);">${unresolved.length}건</span>
    </div>`;
  if(!unresolved.length && !held.length){ html += `<div class="rh-empty">현재 미해결 항목이 없습니다</div>`; }
  unresolved.forEach(r=>{ html += issueCard(r, 'reports'); });
  if(held.length){
    html += `<div class="rh-section-title" style="margin-top:20px;color:var(--amber);">보류 (${held.length}건)</div>`;
    held.forEach(r=> html += issueCard(r, 'reports'));
  }
  if(resolved.length){
    html += `<div class="rh-section-title" style="margin-top:20px;">종결 완료 (${resolved.length}건)</div>`;
    resolved.slice(0,20).forEach(r=> html += issueCard(r, 'reports'));
  }
  body.innerHTML = html;

  let photoData = null;
  document.getElementById('repPhotoBtn').onclick = ()=> document.getElementById('repFile').click();
  document.getElementById('repFile').onchange = async (e)=>{
    if(!e.target.files[0]) return;
    const btn = document.getElementById('repPhotoBtn');
    const origText = btn.innerHTML;
    btn.innerHTML = '처리 중...'; btn.disabled = true;
    try{
      photoData = await compressImage(e.target.files[0], 420);
      const th = document.getElementById('repThumb'); th.src=photoData; th.style.display='block';
    }catch(err){ toast('사진 처리 실패'); }
    btn.innerHTML = origText; btn.disabled = false;
  };
  document.getElementById('repSubmitBtn').onclick = async ()=>{
    const name = document.getElementById('repName').value.trim();
    const theme = document.getElementById('repTheme').value;
    const content = document.getElementById('repContent').value.trim();
    if(!name){ toast('이름을 입력해주세요'); return; }
    if(!content){ toast('내용을 입력해주세요'); return; }
    const btn = document.getElementById('repSubmitBtn');
    btn.disabled = true; btn.textContent = '저장 중...';
    try{
      const rec = { reporter:name, theme, content, photo:photoData, date:todayStr(), status:'unresolved', createdAt:Date.now() };
      await fbAddReport(rec);
      state.reports = await fbGetReports();
      toast('보고가 접수되었습니다');
      render();
    }catch(e){
      btn.disabled=false; btn.textContent='보고 제출';
    }
  };
  wireIssueCardHandlers();
}

// ---------- 현장상황공유 ----------
function renderSituation(){
  const themeOpts = Object.keys(state.themes).map(t=>`<option value="${t}">${t}</option>`).join('');
  const unresolved = state.situations.filter(r=>(r.status||'unresolved')==='unresolved').sort((a,b)=>b.createdAt-a.createdAt);
  const held = state.situations.filter(r=>r.status==='held').sort((a,b)=>b.createdAt-a.createdAt);
  const resolved = state.situations.filter(r=>r.status==='resolved').sort((a,b)=>b.createdAt-a.createdAt);

  let html = `
    <div class="rh-card">
      <div class="rh-label">작성자 이름</div>
      <input class="rh-input" id="sitName" placeholder="이름 입력" style="margin-bottom:12px;">
      <div class="rh-label">관련 테마 (해당없으면 '기타')</div>
      <select class="rh-select" id="sitTheme" style="margin-bottom:12px;">
        <option value="기타">기타</option>${themeOpts}
      </select>
      <div class="rh-label">현장 상황 내용</div>
      <textarea class="rh-textarea" id="sitContent" placeholder="현장 상황을 자유롭게 적어주세요" style="margin-bottom:12px;min-height:90px;"></textarea>
      <div class="rh-label">사진 (선택)</div>
      <div class="rh-photo-row" style="margin-bottom:14px;">
        <button class="rh-photo-btn" id="sitPhotoBtn"><svg class="rh-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1l1.5-2h7L17 6h1a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/><circle cx="12" cy="13" r="3.5"/></svg> 사진 촬영/첨부</button>
        <input type="file" accept="image/*" capture="environment" style="display:none;" id="sitFile">
        <img class="rh-photo-thumb rh-viewable-img" id="sitThumb" style="display:none;">
      </div>
      <button class="rh-btn" id="sitSubmitBtn">공유하기</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin:20px 0 10px;">
      <span class="mono" style="font-size:14px;font-weight:700;">미해결 항목</span>
      <span class="rh-badge" style="color:var(--red);border-color:var(--red);">${unresolved.length}건</span>
    </div>`;
  if(!unresolved.length && !held.length){ html += `<div class="rh-empty">현재 미해결 항목이 없습니다</div>`; }
  unresolved.forEach(r=>{ html += issueCard(r, 'situations'); });
  if(held.length){
    html += `<div class="rh-section-title" style="margin-top:20px;color:var(--amber);">보류 (${held.length}건)</div>`;
    held.forEach(r=> html += issueCard(r, 'situations'));
  }
  if(resolved.length){
    html += `<div class="rh-section-title" style="margin-top:20px;">종결 완료 (${resolved.length}건)</div>`;
    resolved.slice(0,20).forEach(r=> html += issueCard(r, 'situations'));
  }
  body.innerHTML = html;

  let photoData = null;
  document.getElementById('sitPhotoBtn').onclick = ()=> document.getElementById('sitFile').click();
  document.getElementById('sitFile').onchange = async (e)=>{
    if(!e.target.files[0]) return;
    const btn = document.getElementById('sitPhotoBtn');
    const origText = btn.innerHTML;
    btn.innerHTML = '처리 중...'; btn.disabled = true;
    try{
      photoData = await compressImage(e.target.files[0], 420);
      const th = document.getElementById('sitThumb'); th.src=photoData; th.style.display='block';
    }catch(err){ toast('사진 처리 실패'); }
    btn.innerHTML = origText; btn.disabled = false;
  };
  document.getElementById('sitSubmitBtn').onclick = async ()=>{
    const name = document.getElementById('sitName').value.trim();
    const theme = document.getElementById('sitTheme').value;
    const content = document.getElementById('sitContent').value.trim();
    if(!name){ toast('이름을 입력해주세요'); return; }
    if(!content){ toast('내용을 입력해주세요'); return; }
    const btn = document.getElementById('sitSubmitBtn');
    btn.disabled = true; btn.textContent = '저장 중...';
    try{
      const rec = { reporter:name, theme, content, photo:photoData, date:todayStr(), status:'unresolved', createdAt:Date.now() };
      await fbAddSituation(rec);
      state.situations = await fbGetSituations();
      toast('공유되었습니다');
      render();
    }catch(e){
      btn.disabled=false; btn.textContent='공유하기';
    }
  };
  wireIssueCardHandlers();
}
function issueCard(r, collectionName){
  const status = r.status || 'unresolved';
  const statusClass = status==='held' ? 'held' : (status==='resolved' ? 'resolved' : '');
  let html = `<div class="rh-issue ${statusClass}">
    <div class="rh-issue-top"><span>${r.theme}</span><span>${r.date}</span></div>`;

  if(status==='resolved'){
    html += `
    <div class="rh-issue-content">${r.content}</div>
    ${r.resolvePhoto? `<img class="rh-viewable-img rh-resolve-photo" src="${r.resolvePhoto}">`:''}
    <div style="font-size:11px;color:var(--muted);margin:6px 0 2px;">종결 처리 완료</div>
    ${r.photo? `<img class="rh-viewable-img rh-problem-photo-small" src="${r.photo}">`:''}
    <div style="font-size:11px;color:var(--muted);margin-top:8px;">보고자: ${r.reporter}</div>`;
  }else{
    html += `
    <div class="rh-issue-content">${r.content}</div>
    ${r.photo? `<img class="rh-viewable-img" src="${r.photo}" style="width:100%;max-width:220px;border-radius:8px;margin-bottom:8px;display:block;cursor:zoom-in;">`:''}
    ${status==='held'? `<div class="rh-hold-reason"><b>보류 사유:</b> ${r.holdReason||''}</div>`:''}
    <div style="font-size:11px;color:var(--muted);margin:8px 0;">보고자: ${r.reporter}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      ${status!=='held'? `<button class="rh-btn hold-btn" data-id="${r.id}" data-col="${collectionName}" style="width:auto;padding:6px 14px;font-size:12px;">보류</button>`:''}
      <button class="rh-btn ghost resolve-open-btn" data-id="${r.id}" data-col="${collectionName}" style="width:auto;padding:6px 14px;font-size:12px;"><svg class="rh-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> 종결</button>
    </div>
    <div class="rh-resolve-expand" id="resolve-expand-${r.id}">
      <div class="rh-label" style="margin-top:10px;">종결 사진 (필수)</div>
      <div class="rh-photo-row">
        <button class="rh-photo-btn resolve-photo-btn" data-id="${r.id}"><svg class="rh-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1l1.5-2h7L17 6h1a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/><circle cx="12" cy="13" r="3.5"/></svg> 종결 사진 촬영/첨부</button>
        <input type="file" accept="image/*" capture="environment" style="display:none;" id="resolve-file-${r.id}">
        <img class="rh-photo-thumb" id="resolve-thumb-${r.id}" style="display:none;">
      </div>
      <button class="rh-btn resolve-confirm-btn" data-id="${r.id}" data-col="${collectionName}" style="margin-top:10px;" disabled>종결 확정 (사진을 먼저 첨부하세요)</button>
    </div>`;
  }
  html += `</div>`;
  return html;
}
let pendingResolvePhotos = {};

async function refreshCollection(collectionName){
  if(collectionName==='reports'){ state.reports = await fbGetReports(); }
  else{ state.situations = await fbGetSituations(); }
  render();
}

function wireIssueCardHandlers(){
  body.querySelectorAll('.hold-btn').forEach(b=>{
    b.onclick = async ()=>{
      let reason = '';
      while(true){
        reason = prompt('보류 사유를 입력해주세요 (필수)', reason||'');
        if(reason === null) return;
        reason = reason.trim();
        if(reason) break;
        alert('보류 사유는 반드시 입력해야 합니다.');
      }
      try{
        await fbUpdateIssueStatus(b.dataset.col, b.dataset.id, 'held', {holdReason: reason});
        toast('보류 처리되었습니다');
        await refreshCollection(b.dataset.col);
      }catch(e){}
    };
  });
  body.querySelectorAll('.resolve-open-btn').forEach(b=>{
    b.onclick = ()=>{
      const el = document.getElementById('resolve-expand-'+b.dataset.id);
      el.classList.toggle('show');
    };
  });
  body.querySelectorAll('.resolve-photo-btn').forEach(b=>{
    b.onclick = ()=> document.getElementById('resolve-file-'+b.dataset.id).click();
  });
  body.querySelectorAll('[id^="resolve-file-"]').forEach(inp=>{
    inp.onchange = async ()=>{
      const id = inp.id.replace('resolve-file-','');
      if(!inp.files[0]) return;
      const btn = body.querySelector(`.resolve-photo-btn[data-id="${id}"]`);
      const origText = btn.innerHTML;
      btn.innerHTML = '처리 중...'; btn.disabled = true;
      try{
        const dataUrl = await compressImage(inp.files[0], 640, 0.6);
        pendingResolvePhotos[id] = dataUrl;
        const th = document.getElementById('resolve-thumb-'+id);
        th.src = dataUrl; th.style.display='block';
        const confirmBtn = body.querySelector(`.resolve-confirm-btn[data-id="${id}"]`);
        confirmBtn.disabled = false; confirmBtn.textContent = '종결 확정';
      }catch(e){ toast('사진 처리 실패'); }
      btn.innerHTML = origText; btn.disabled = false;
    };
  });
  body.querySelectorAll('.resolve-confirm-btn').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.id, col = b.dataset.col;
      const photo = pendingResolvePhotos[id];
      if(!photo){ toast('종결 사진을 먼저 첨부해주세요'); return; }
      if(!confirm('종결 처리하시겠습니까? 이후에는 되돌릴 수 없습니다.')) return;
      b.disabled = true; b.textContent = '저장 중...';
      try{
        await fbUpdateIssueStatus(col, id, 'resolved', {resolvePhoto: photo});
        delete pendingResolvePhotos[id];
        toast('종결 처리되었습니다');
        await refreshCollection(col);
      }catch(e){ b.disabled=false; b.textContent='종결 확정'; }
    };
  });
}


// ---------- 알림 기능 ----------
let audioCtx = null;
function playAlertSound(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+0.5);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.55);
    setTimeout(()=>{
      const o2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
      o2.type='sine'; o2.frequency.value=1046;
      g2.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime+0.01);
      g2.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+0.5);
      o2.connect(g2); g2.connect(audioCtx.destination);
      o2.start(); o2.stop(audioCtx.currentTime+0.55);
    }, 180);
  }catch(e){}
}

function notifyNewIssue(label, data){
  playAlertSound();
  toast('새 '+label+' 접수: '+(data.theme?('['+data.theme+'] '):'')+data.content);
  if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
    navigator.serviceWorker.ready.then(reg=>{
      reg.showNotification(label+' 접수 — 3호점', {
        body: (data.theme? '['+data.theme+'] ' : '') + data.content + ' (보고자: '+data.reporter+')',
        icon: 'icons/icon-192.png',
        tag: 'rh-'+Date.now()
      }).catch(()=>{});
    }).catch(()=>{});
  }
  if(state.tab==='home') renderHome();
}

function watchForNewIssues(){
  [['reports','특이사항 보고'], ['situations','현장상황공유']].forEach(([col, label])=>{
    let initial = true;
    db.collection(col).where('status','==','unresolved').onSnapshot(snap=>{
      snap.docChanges().forEach(change=>{
        if(change.type==='added' && !initial){
          notifyNewIssue(label, change.doc.data());
        }
      });
      initial = false;
      if(col==='reports') fbGetReports().then(r=>{ state.reports=r; if(state.tab==='home'||state.tab==='report') render(); });
      if(col==='situations') fbGetSituations().then(r=>{ state.situations=r; if(state.tab==='home'||state.tab==='situation') render(); });
    }, err=> console.error('watch error', col, err));
  });
}

async function enableNotifications(){
  const btn = document.getElementById('notifBtn');
  if(!('Notification' in window)){ toast('이 브라우저는 알림을 지원하지 않습니다'); return; }
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') await audioCtx.resume();
  }catch(e){}
  const perm = await Notification.requestPermission();
  if(perm === 'granted'){
    localStorage.setItem('rh-notif-enabled', '1');
    if(btn){ btn.textContent = '🔔 알림 켜짐'; btn.disabled = true; }
    toast('알림이 켜졌습니다. 이 화면을 켜두시면 새 보고가 올라올 때 알려드려요');
    playAlertSound();
  }else{
    toast('알림 권한이 허용되지 않았습니다. 브라우저 설정에서 허용해주세요');
  }
}

async function init(){
  body.innerHTML = '<div class="rh-empty">불러오는 중...</div>';
  const [themes, reports, situations, inspections] = await Promise.all([fbGetThemes(), fbGetReports(), fbGetSituations(), fbGetInspections()]);
  state.themes = themes; state.reports = reports; state.situations = situations; state.inspections = inspections;
  render();
  watchForNewIssues();
}
init();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(e=> console.error('SW 등록 실패', e));
}

</script>
